<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수룡이 옷입히기</title>
    
    <!-- 이미지 저장을 위한 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #fce4ec; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-wrapper {
            width: 100%;
            max-width: 400px;
            /* 💡 1:1 비율에 맞춘 원래 높이 */
            height: 680px; 
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 1. 시작 화면 */
        #start-screen {
            width: 100%;
            height: 100%;
            background-image: url('start.png'); 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;   
            padding-bottom: 80px;    
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100; 
            background-color: #fce4ec; 
        }

        .start-btn {
            background-color: #5f27cd; 
            color: white;
            border: 3px solid #fff;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        /* 2. 메인 게임 영역 */
        #main-game-area {
            display: none; 
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* 📸 사진으로 저장될 배경 영역 - 1:1 정사각형 400px 비율 */
        #capture-area {
            position: relative;
            width: 100%;
            height: 400px; 
            border-bottom: 2px solid #eee;
            overflow: hidden;
            background-color: #fff;
            flex-shrink: 0;
        }

        /* 💡 배경이 임의로 1:1 컷팅되지 않고 자연스럽게 크기를 갖도록 object-fit 제거 */
        #bg-img {
            position: absolute;
            z-index: 1; 
            transform-origin: center center;
        }

        /* 수룡이와 옷을 하나로 묶어주는 그룹 */
        #character-group {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: center center;
            z-index: 5; 
            /* 빈 공간 클릭 시 클릭이 통과되어 배경을 잡을 수 있도록 허용! */
            pointer-events: none; 
        }

        /* 빈 공간은 클릭이 통과되더라도 수룡이와 옷은 다시 클릭 가능하게 설정 */
        #character-group img {
            pointer-events: auto; 
        }

        .layer { position: absolute; display: none; }
        
        #layer-base {
            position: absolute;
            display: block; 
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            height: 320px;
            z-index: 10;
        }

        /* 기본 z-index 제거 (스크립트에서 동적으로 관리됨) */
        #layer-bottom { }
        #layer-shoes  { } 
        #layer-top    { }

        .draggable { cursor: grab; }
        .draggable:active { cursor: grabbing; }

        /* 하단 조작부 공통 */
        .bottom-panel {
            flex: 1; display: flex; flex-direction: column; background: white; overflow: hidden;
        }

        /* 패널 A: 옷 고르기 */
        #panel-dressup { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .tabs { display: flex; background-color: #fafafa; flex-shrink: 0; }
        .tab {
            flex: 1; padding: 12px 0; text-align: center; font-size: 15px; font-weight: bold;
            color: #999; cursor: pointer; border-bottom: 3px solid transparent;
        }
        .tab.active { color: #ff6b81; border-bottom: 3px solid #ff6b81; background-color: white; }
        
        /* 💡 가로 스크롤(스와이프) 유지 & 상하 여백 꽉 차게 변경 */
        .item-list {
            display: none; padding: 0 15px; gap: 15px;
            flex: 1; /* 💡 세로 남는 공간을 모두 차지하도록 변경 */
            overflow-x: auto; 
            overflow-y: hidden;
            white-space: nowrap; 
            align-items: center; /* 💡 세로 기준 한가운데 정렬 */
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        .item-list::-webkit-scrollbar {
            display: none; 
        }

        .item-list.active { display: flex; }
        
        /* 💡 버튼 크기를 아주 큼직하게 1줄로 확장 */
        .item-btn {
            flex: 0 0 auto; 
            width: 100px; height: 100px; /* 65px -> 100px로 대폭 확대 */
            border: 2px solid #eee; border-radius: 16px; background-color: #fff;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            font-size: 14px; font-weight: bold; color: #555; text-align: center; /* 폰트 크기 확대 */
            white-space: normal; /* 긴 글씨는 안에서 줄바꿈 허용 */
            word-break: keep-all; 
            padding: 5px; box-sizing: border-box;
        }
        .item-btn:active { background-color: #ffeef0; border-color: #ff6b81; transform: scale(0.95); }
        .btn-remove { color: #ff4757; font-size: 32px; } /* X 아이콘도 비례해서 확대 */
        .next-step-btn { margin: auto 15px 15px 15px; padding: 12px; border-radius: 10px; border: none; background-color: #6c5ce7; color: white; font-weight: bold; font-size: 16px; cursor: pointer; flex-shrink: 0; }

        /* 패널 B: 배경 고르기 */
        #panel-background { display: none; flex-direction: column; padding: 20px; height: 100%; box-sizing: border-box;}
        .bg-title { text-align: center; font-weight: bold; color: #333; margin-top: 0; margin-bottom: 10px; font-size: 14px;}
        
        .size-control-group {
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; 
            padding: 10px 15px; background: #f8f9fa; border-radius: 10px;
        }
        .size-control { display: flex; align-items: center; gap: 10px; }
        .size-control label { font-weight: bold; font-size: 13px; color: #555; width: 65px; }
        .size-control input[type=range] { flex: 1; }
        
        .bg-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; align-content: flex-start; }
        .bg-btn { padding: 12px; border: 2px solid #eee; border-radius: 10px; background: #fff; font-weight: bold; color: #555; cursor: pointer; text-align: center; font-size: 13px; }
        .bg-btn:active { background: #ffeef0; border-color: #ff6b81; color: #ff6b81; }
        
        .action-btns { display: flex; gap: 10px; margin-top: auto; }
        .btn-back { flex: 1; padding: 12px; border: none; border-radius: 10px; background: #dfe6e9; color: #2d3436; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-save { flex: 1; padding: 12px; border: none; border-radius: 10px; background: #ff6b81; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- [1] 시작 화면 -->
        <div id="start-screen">
            <button class="start-btn" onclick="startGame()">게임 시작</button>
        </div>

        <!-- [2] 메인 게임 영역 -->
        <div id="main-game-area">
            
            <!-- 📸 실제 캡처 영역 -->
            <div id="capture-area">
                <img id="bg-img" alt="배경">
                
                <div id="character-group">
                    <img src="수룡이.png" id="layer-base" alt="수룡이">
                    <img src="" id="layer-bottom" class="layer draggable" alt="하의">
                    <img src="" id="layer-shoes" class="layer draggable" alt="신발"> 
                    <img src="" id="layer-top" class="layer draggable" alt="상의">
                </div>
            </div>

            <!-- 하단 조작부 -->
            <div class="bottom-panel">
                
                <!-- 패널 A: 옷입히기 -->
                <div id="panel-dressup">
                    <div class="tabs">
                        <div class="tab active" onclick="switchTab('top')">상의</div>
                        <div class="tab" onclick="switchTab('bottom')">하의</div>
                        <div class="tab" onclick="switchTab('shoes')">신발</div> 
                        <div class="tab" onclick="switchTab('acc')">장신구</div>
                    </div>

                    <!-- 상의 아이템 목록 -->
                    <div id="tab-top" class="item-list active">
                        <button class="item-btn btn-remove" onclick="equipItem('layer-top', null)">✖</button>
                        <button class="item-btn" onclick="equipItem('layer-top', topData.saekdong)">노란저고리</button>
                        <button class="item-btn" onclick="equipItem('layer-top', topData.yellowTop)">금박색동저고리</button>
                        <button class="item-btn" onclick="equipItem('layer-top', topData.whiteTop)">적삼</button>
                    </div>

                    <!-- 하의 아이템 목록 -->
                    <div id="tab-bottom" class="item-list">
                        <button class="item-btn btn-remove" onclick="equipItem('layer-bottom', null)">✖</button>
                        <button class="item-btn" onclick="equipItem('layer-bottom', bottomData.pinkPants)">조끼허리바지</button>
                        <button class="item-btn" onclick="equipItem('layer-bottom', bottomData.redSkirt)">금박치마</button>
                        <button class="item-btn" onclick="equipItem('layer-bottom', bottomData.yellowSkirt)">노란한복치마</button>
                        <button class="item-btn" onclick="equipItem('layer-bottom', bottomData.whitePants)">전통한복바지</button>
                    </div>

                    <!-- 신발 아이템 목록 -->
                    <div id="tab-shoes" class="item-list">
                        <button class="item-btn btn-remove" onclick="equipItem('layer-shoes', null)">✖</button>
                        <button class="item-btn" onclick="equipItem('layer-shoes', shoesData.redShoes)">전통가죽신</button>
                        <button class="item-btn" onclick="equipItem('layer-shoes', shoesData.strawShoes)">짚신</button>
                    </div>

                    <!-- 장신구 아이템 목록 (여러 개 추가) -->
                    <div id="tab-acc" class="item-list">
                        <button class="item-btn btn-remove" onclick="addAccessory(null)">✖</button>
                        <button class="item-btn" onclick="addAccessory(accData.goldHat)">복건</button>
                        <button class="item-btn" onclick="addAccessory(accData.handMirror)">자수 거울</button>
                    </div>

                    <button class="next-step-btn" onclick="goToBackgroundStep()">배경 선택 & 저장하기 ➔</button>
                </div>

                <!-- 패널 B: 배경 고르기 -->
                <div id="panel-background">
                    <p class="bg-title">배경이나 수룡이를 자유롭게 드래그해보세요!</p>
                    
                    <!-- 배경과 수룡이를 각각 조절하는 슬라이더 -->
                    <div class="size-control-group">
                        <div class="size-control">
                            <label>수룡이</label>
                            <input type="range" id="size-slider" min="0.5" max="1.5" step="0.05" value="1" style="accent-color: #ff6b81;" oninput="resizeCharacter(this.value)">
                        </div>
                        <div class="size-control">
                            <label>배경 크기</label>
                            <input type="range" id="bg-size-slider" min="0.5" max="3.0" step="0.05" value="1" style="accent-color: #6c5ce7;" oninput="resizeBackground(this.value)">
                        </div>
                    </div>
                    
                    <div class="bg-list">
                        <!-- 파일 업로드를 위한 숨겨진 input 태그 추가 -->
                        <input type="file" id="bg-upload" accept="image/*" style="display: none;" onchange="uploadBackground(event)">
                        
                        <button class="bg-btn" onclick="document.getElementById('bg-upload').click()" style="color: #6c5ce7;">📸 내 앨범 사진</button>
                        <button class="bg-btn" onclick="changeBackground('back1.png')">성신 잔디밭</button>
                        <button class="bg-btn" onclick="changeBackground('back2.png')">박물관 수룡</button>
                        <button class="bg-btn" onclick="changeBackground('back3.png')">수룡이 발바닥</button>
                    </div>

                    <div class="action-btns">
                        <button class="btn-back" onclick="goToDressupStep()">⬅ 옷 수정</button>
                        <button class="btn-save" onclick="saveCharacter()">📸 앨범에 저장</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let currentStep = 'dressup';
        let currentScale = 1;
        let globalZIndex = 1000; 

        // 페이지가 로드되면 기본 배경(back3)을 부릅니다.
        window.addEventListener('DOMContentLoaded', () => {
            changeBackground('back3.png');
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-game-area').style.display = 'flex';
        }

        function goToBackgroundStep() {
            currentStep = 'background';
            document.getElementById('panel-dressup').style.display = 'none';
            document.getElementById('panel-background').style.display = 'flex';
        }

        function goToDressupStep() {
            currentStep = 'dressup';
            document.getElementById('panel-background').style.display = 'none';
            document.getElementById('panel-dressup').style.display = 'flex';
        }

        // 버튼으로 기본 제공 배경을 선택할 때
        function changeBackground(bgImageSrc) {
            const bgImg = document.getElementById('bg-img');
            bgImg.src = bgImageSrc;
            bgImg.style.transform = 'scale(1)';
            document.getElementById('bg-size-slider').value = 1;
            alignBackgroundToCenter(bgImg);
        }

        // 앨범에서 사진을 불러왔을 때 
        function uploadBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const bgImg = document.getElementById('bg-img');
                    bgImg.src = e.target.result;
                    bgImg.style.transform = 'scale(1)';
                    document.getElementById('bg-size-slider').value = 1;
                    alignBackgroundToCenter(bgImg);
                };
                reader.readAsDataURL(file);
            }
        }

        // 💡 수정완료: 화면 렌더링(display:none) 오류 무시하고 무조건 400x400 기준으로 딱 맞게 계산
        function alignBackgroundToCenter(bgImg) {
            const align = () => {
                if (!bgImg.naturalWidth) return;
                
                const contW = 400; // 고정된 1:1 창 너비
                const contH = 400; // 고정된 1:1 창 높이
                
                const imgRatio = bgImg.naturalWidth / bgImg.naturalHeight;
                const contRatio = contW / contH;
                
                let imgW, imgH;
                if (imgRatio > contRatio) {
                    imgH = contH;
                    imgW = contH * imgRatio;
                    bgImg.style.height = '100%';
                    bgImg.style.width = 'auto';
                } else {
                    imgW = contW;
                    imgH = contW / imgRatio;
                    bgImg.style.width = '100%';
                    bgImg.style.height = 'auto';
                }
                
                // offset 값 대신 절대 수치로 계산하여 강제로 중앙 고정
                bgImg.style.left = (contW - imgW) / 2 + 'px';
                bgImg.style.top = (contH - imgH) / 2 + 'px';
            };

            if (bgImg.complete && bgImg.naturalWidth) {
                align();
            } else {
                bgImg.onload = align;
            }
        }

        function resizeCharacter(scale) {
            currentScale = scale;
            document.getElementById('character-group').style.transform = `scale(${currentScale})`;
        }

        function resizeBackground(scale) {
            document.getElementById('bg-img').style.transform = `scale(${scale})`;
        }

        function saveCharacter() {
            const captureArea = document.getElementById('capture-area');

            html2canvas(captureArea, { 
                scale: 4, 
                useCORS: true, 
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '수룡이_코디.png';
                link.href = canvas.toDataURL('image/png', 1.0); 
                link.click();
            });
        }

        const topData = { 
            saekdong: { src: '수룡_상의1.png', width: '195px', top: '190px', left: '90px' },
            yellowTop: { src: '수룡_상의2.png', width: '195px', top: '190px', left: '80px' },
            whiteTop: { src: '수룡_상의3.png', width: '195px', top: '190px', left: '80px' } 
        };
        
        const bottomData = { 
            pinkPants: { src: '수룡_하의1.png', width: '175px', top: '240px', left: '145px' },
            redSkirt: { src: '수룡_하의2.png', width: '180px', top: '240px', left: '100px' }, 
            yellowSkirt: { src: '수룡_하의3.png', width: '200px', top: '240px', left: '100px' },
            whitePants: { src: '수룡_하의4.png', width: '120px', top: '240px', left: '110px' } 
        };

        const shoesData = { 
            redShoes: { src: '수룡_신발1.png', width: '140px', top: '250px', left: '130px' },
            strawShoes: { src: '수룡_신발2.png', width: '140px', top: '250px', left: '130px' } 
        };
        
        const accData = { 
            goldHat: { src: '수룡_모자1.png', width: '200px', top: '40px', left: '130px' },
            handMirror: { src: '장신구 1_거울.png', width: '100px', top: '150px', left: '50px' } 
        };

        function switchTab(category) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.item-list').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + category).classList.add('active');
        }

        function equipItem(layerId, itemData) {
            const layer = document.getElementById(layerId);
            if (itemData === null) {
                layer.style.display = 'none';
                layer.src = '';
            } else {
                layer.src = itemData.src;
                layer.style.width = itemData.width;
                layer.style.top = itemData.top;
                layer.style.left = itemData.left;
                layer.style.display = 'block';
                layer.style.zIndex = globalZIndex--; 
            }
        }

        function addAccessory(itemData) {
            if (itemData === null) {
                const accs = document.querySelectorAll('.acc-layer');
                accs.forEach(acc => acc.remove());
            } else {
                const img = document.createElement('img');
                img.src = itemData.src;
                img.className = 'layer draggable acc-layer';
                img.style.width = itemData.width;
                img.style.top = itemData.top;
                img.style.left = itemData.left;
                img.style.display = 'block';
                img.style.zIndex = globalZIndex--; 
                document.getElementById('character-group').appendChild(img);
            }
        }

        let activeItem = null;
        let startX = 0, startY = 0;
        let initialLeft = 0, initialTop = 0;

        const captureAreaElement = document.getElementById('capture-area');
        captureAreaElement.addEventListener('mousedown', dragStart);
        captureAreaElement.addEventListener('touchstart', dragStart, { passive: false });
        
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            if (currentStep === 'dressup') {
                if (e.target.classList.contains('draggable') && e.target.style.display !== 'none') {
                    activeItem = e.target;
                } else return;
            } else if (currentStep === 'background') {
                if (e.target.id === 'bg-img') {
                    activeItem = document.getElementById('bg-img');
                } else {
                    activeItem = document.getElementById('character-group');
                }
            }

            if (activeItem) {
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                startX = clientX;
                startY = clientY;
                initialLeft = parseFloat(activeItem.style.left) || 0;
                initialTop = parseFloat(activeItem.style.top) || 0;
            }
        }

        function dragMove(e) {
            if (!activeItem) return;
            e.preventDefault(); 
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const dx = clientX - startX;
            const dy = clientY - startY;
            
            activeItem.style.left = `${initialLeft + dx}px`;
            activeItem.style.top = `${initialTop + dy}px`;
        }

        function dragEnd() { activeItem = null; }
    </script>
</body>
</html>
